<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Honk Lotto</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    background:
      radial-gradient(circle at 12% 18%, #fff 0 18px, transparent 20px),
      radial-gradient(circle at 22% 14%, #fff 0 28px, transparent 30px),
      radial-gradient(circle at 80% 8%, #fff 0 22px, transparent 24px),
      linear-gradient(#8fd4ff, #fff3c9 58%, #ffd7a1);
    color: #241c16;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  }
  .panel {
    background: #fffdf8;
    border: 4px solid #241c16;
    border-radius: 28px;
    box-shadow: 0 8px 0 #241c16;
    padding: 16px 16px 14px;
  }
  .panel.shake { animation: shake 0.42s linear; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20% { transform: translate(-7px, 2px) rotate(-0.6deg); }
    40% { transform: translate(8px, -3px) rotate(0.7deg); }
    60% { transform: translate(-5px, -2px) rotate(-0.4deg); }
    80% { transform: translate(4px, 2px) rotate(0.3deg); }
  }
  .eyebrow {
    margin: 0;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12px;
    color: #c45b18;
  }
  h1 {
    margin: 2px 0 0;
    font-size: clamp(36px, 9vw, 48px);
    line-height: 0.95;
    letter-spacing: -0.04em;
  }
  .score-label {
    margin: 10px 0 0;
    text-align: center;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 12px;
    color: #6d6256;
  }
  #total {
    margin: 0;
    text-align: center;
    font-weight: 900;
    font-size: clamp(72px, 20vw, 108px);
    line-height: 0.86;
    color: #178a45;
    text-shadow: 0 4px 0 #c8efd4;
  }
  #total.pop { animation: pop 0.34s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  #say {
    margin: 8px 0 0;
    min-height: 3.2em;
    text-align: center;
    font-weight: 700;
    line-height: 1.35;
  }
  .stage {
    margin-top: 8px;
    border-radius: 18px;
    overflow: hidden;
    border: 3px solid #241c16;
    background: #b9e6ff;
    touch-action: none;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
    cursor: crosshair;
  }
  .meter-label {
    margin: 10px 0 6px;
    font-size: 13px;
    font-weight: 800;
    color: #6d6256;
  }
  .meter {
    height: 14px;
    border: 3px solid #241c16;
    border-radius: 999px;
    overflow: hidden;
    background: #fff;
  }
  .meter span {
    display: block;
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(90deg, #ffbf1a, #ffbf1a 10px, #ffe38a 10px, #ffe38a 20px);
  }
  button {
    margin-top: 12px;
    width: 100%;
    min-height: 52px;
    border-radius: 14px;
    border: 3px solid #241c16;
    background: #ff4f81;
    color: #fff;
    font: 800 18px "Trebuchet MS", "Segoe UI", sans-serif;
    box-shadow: 0 4px 0 #241c16;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #241c16; }
  button:focus-visible, canvas:focus-visible {
    outline: 3px solid #2f6fed;
    outline-offset: 3px;
  }
  .hint {
    margin: 10px 4px 0;
    color: #4e453c;
    font-size: 14px;
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .panel.shake, #total.pop { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <main class="panel" id="panel">
      <p class="eyebrow">Absurd poultry finance</p>
      <h1>Honk Lotto</h1>
      <p class="score-label">Score</p>
      <p id="total" data-total="0" aria-live="polite" aria-atomic="true">$0</p>
      <p id="say">Scratch the silver egg. Finish a scratch and the goose pays exactly $1.</p>
      <div class="stage">
        <canvas id="egg" width="480" height="540" tabindex="0" aria-label="Cartoon goose sitting on a silver egg. Scratch the egg to earn one dollar."></canvas>
      </div>
      <p class="meter-label" id="meterLabel">Scratch the egg</p>
      <div class="meter" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Scratch progress">
        <span id="bar"></span>
      </div>
      <button id="reset" type="button">Reset</button>
      <p class="hint">Click and drag across the egg. On a phone, press and rub. Each finished scratch adds $1. Reset clears the score. These dollars are only a score.</p>
    </main>
  </div>
<script>
(() => {
  const W = 480;
  const H = 540;
  const egg = { cx: 240, cy: 408, rx: 156, ry: 108 };
  const BRUSH = 38;
  const COVER_TO_WIN = 0.34;
  const COLS = 40;
  const ROWS = 28;
  const INK = "#241c16";

  const canvas = document.getElementById("egg");
  const ctx = canvas.getContext("2d");
  const foil = document.createElement("canvas");
  const foilCtx = foil.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const panel = document.getElementById("panel");
  const totalEl = document.getElementById("total");
  const sayEl = document.getElementById("say");
  const barEl = document.getElementById("bar");
  const progressEl = document.getElementById("progress");
  const meterLabel = document.getElementById("meterLabel");
  const resetBtn = document.getElementById("reset");

  const inside = new Uint8Array(COLS * ROWS);
  const marked = new Uint8Array(COLS * ROWS);
  let insideCount = 0;
  let markedCount = 0;

  let total = 0;
  let accepting = true;
  let scratching = false;
  let last = null;
  let round = 0;
  let timer = 0;
  let hop = 0;
  let look = { x: egg.cx, y: egg.cy - 40 };
  let bubble = "Scratch?";
  const sparkles = [];
  const particles = [];
  let floater = null;
  let audio = null;

  const wins = [
    "HONK. That's one dollar.",
    "The egg was insured. For a dollar.",
    "Spend it all in one place. There is one place.",
    "Economists just felt a chill.",
    "Whole dollars only. The goose ate the cents."
  ];

  function setupCanvas(c, context) {
    c.width = W * dpr;
    c.height = H * dpr;
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvas(canvas, ctx);
  setupCanvas(foil, foilCtx);

  function cellCenter(c, r) {
    return {
      x: egg.cx - egg.rx + (c + 0.5) * (egg.rx * 2 / COLS),
      y: egg.cy - egg.ry + (r + 0.5) * (egg.ry * 2 / ROWS)
    };
  }

  function buildInside() {
    insideCount = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = cellCenter(c, r);
        const nx = (p.x - egg.cx) / egg.rx;
        const ny = (p.y - egg.cy) / egg.ry;
        const inn = nx * nx + ny * ny <= 0.9 * 0.9;
        inside[r * COLS + c] = inn ? 1 : 0;
        if (inn) insideCount++;
      }
    }
  }

  function clearMarks() {
    marked.fill(0);
    markedCount = 0;
    updateMeter();
  }

  function updateMeter() {
    const ratio = insideCount ? markedCount / insideCount : 0;
    const pct = Math.max(0, Math.min(100, Math.round((ratio / COVER_TO_WIN) * 100)));
    barEl.style.width = pct + "%";
    progressEl.setAttribute("aria-valuenow", String(pct));
    if (pct >= 100) meterLabel.textContent = "Paid";
    else if (pct > 0) meterLabel.textContent = "Keep scratching";
    else meterLabel.textContent = "Scratch the egg";
  }

  function renderTotal(pop) {
    totalEl.dataset.total = String(total);
    totalEl.textContent = "$" + total;
    if (!pop) return;
    totalEl.classList.remove("pop");
    void totalEl.offsetWidth;
    totalEl.classList.add("pop");
  }

  function say(text) { sayEl.textContent = text; }

  function shake() {
    panel.classList.remove("shake");
    void panel.offsetWidth;
    panel.classList.add("shake");
  }

  function honk() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audio) audio = new AC();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const o2 = audio.createOscillator();
    const g = audio.createGain();
    o.type = "triangle";
    o2.type = "square";
    o.frequency.setValueAtTime(680, t);
    o.frequency.exponentialRampToValueAtTime(210, t + 0.18);
    o2.frequency.setValueAtTime(340, t);
    o2.frequency.exponentialRampToValueAtTime(120, t + 0.18);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g);
    o2.connect(g);
    g.connect(audio.destination);
    o.start(t);
    o2.start(t);
    o.stop(t + 0.24);
    o2.stop(t + 0.24);
  }

  function paintFoil() {
    const f = foilCtx;
    f.setTransform(dpr, 0, 0, dpr, 0, 0);
    f.clearRect(0, 0, W, H);
    f.save();
    f.beginPath();
    f.ellipse(egg.cx, egg.cy, egg.rx - 3, egg.ry - 3, 0, 0, Math.PI * 2);
    f.clip();
    const g = f.createLinearGradient(egg.cx - egg.rx, egg.cy - egg.ry, egg.cx + egg.rx, egg.cy + egg.ry);
    g.addColorStop(0, "#f4f7fb");
    g.addColorStop(0.42, "#c5ccd8");
    g.addColorStop(0.5, "#ffffff");
    g.addColorStop(1, "#8e98ab");
    f.fillStyle = g;
    f.fillRect(0, 0, W, H);
    f.globalAlpha = 0.55;
    f.strokeStyle = "#ffffff";
    f.lineWidth = 2;
    for (let i = -10; i < 18; i++) {
      f.beginPath();
      f.moveTo(egg.cx - egg.rx + i * 24, egg.cy - egg.ry - 10);
      f.lineTo(egg.cx - egg.rx + i * 24 + 48, egg.cy + egg.ry + 10);
      f.stroke();
    }
    f.globalAlpha = 1;
    f.fillStyle = "#2d3648";
    f.textAlign = "center";
    f.textBaseline = "middle";
    f.font = "800 28px Trebuchet MS, Segoe UI, sans-serif";
    f.fillText("SCRATCH", egg.cx, egg.cy - 10);
    f.font = "700 15px Trebuchet MS, Segoe UI, sans-serif";
    f.fillText("the fancy egg", egg.cx, egg.cy + 20);
    f.restore();
    clearMarks();
  }

  function markAt(x, y) {
    const left = egg.cx - egg.rx;
    const top = egg.cy - egg.ry;
    const cw = (egg.rx * 2) / COLS;
    const rh = (egg.ry * 2) / ROWS;
    const c0 = Math.max(0, Math.floor((x - BRUSH - left) / cw));
    const c1 = Math.min(COLS - 1, Math.floor((x + BRUSH - left) / cw));
    const r0 = Math.max(0, Math.floor((y - BRUSH - top) / rh));
    const r1 = Math.min(ROWS - 1, Math.floor((y + BRUSH - top) / rh));
    const reach = BRUSH * BRUSH;
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const i = r * COLS + c;
        if (!inside[i] || marked[i]) continue;
        const p = cellCenter(c, r);
        const dx = p.x - x;
        const dy = p.y - y;
        if (dx * dx + dy * dy <= reach) {
          marked[i] = 1;
          markedCount++;
        }
      }
    }
  }

  function scratchSegment(x0, y0, x1, y1) {
    foilCtx.save();
    foilCtx.globalCompositeOperation = "destination-out";
    foilCtx.strokeStyle = "#000";
    foilCtx.lineCap = "round";
    foilCtx.lineJoin = "round";
    foilCtx.lineWidth = BRUSH * 2;
    foilCtx.beginPath();
    foilCtx.moveTo(x0, y0);
    foilCtx.lineTo(x1, y1);
    foilCtx.stroke();
    foilCtx.restore();

    const dist = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.max(1, Math.ceil(dist / (BRUSH * 0.45)));
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const x = x0 + (x1 - x0) * t;
      const y = y0 + (y1 - y0) * t;
      markAt(x, y);
      if (s % 2 === 0) {
        sparkles.push({
          x, y,
          vx: (Math.random() - 0.5) * 1.4,
          vy: -0.6 - Math.random() * 1.2,
          life: 1,
          r: 2 + Math.random() * 3
        });
      }
    }
    if (sparkles.length > 90) sparkles.splice(0, sparkles.length - 90);
    updateMeter();
    if (accepting && insideCount && markedCount / insideCount >= COVER_TO_WIN) completeScratch();
  }

  function completeScratch() {
    if (!accepting) return;
    accepting = false;
    scratching = false;
    last = null;
    const token = ++round;
    total += 1;
    renderTotal(true);
    shake();
    honk();
    hop = 1;
    bubble = "HONK!";
    say(wins[Math.floor(Math.random() * wins.length)] + " Score: $" + total + ".");
    meterLabel.textContent = "Paid";
    barEl.style.width = "100%";
    progressEl.setAttribute("aria-valuenow", "100");
    foilCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    foilCtx.clearRect(0, 0, W, H);
    floater = { y: egg.cy - 78, life: 1 };
    for (let i = 0; i < 28; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1.6 + Math.random() * 4.8;
      particles.push({
        x: egg.cx,
        y: egg.cy,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 2.4,
        life: 1,
        kind: i % 2 ? "coin" : "feather",
        rot: Math.random() * 6,
        vr: (Math.random() - 0.5) * 0.28
      });
    }
    timer = setTimeout(() => {
      if (token !== round) return;
      accepting = true;
      paintFoil();
      bubble = "Again?";
      say("New egg. Same goose. Finish another scratch for another $1.");
    }, 1100);
  }

  function resetAll() {
    round++;
    clearTimeout(timer);
    total = 0;
    renderTotal(false);
    accepting = true;
    scratching = false;
    last = null;
    hop = 0;
    floater = null;
    sparkles.length = 0;
    particles.length = 0;
    paintFoil();
    bubble = "Zero!";
    say("Score is $0. The egg is wrapped again.");
  }

  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - r.left) / r.width) * W,
      y: ((e.clientY - r.top) / r.height) * H
    };
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (!accepting) return;
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    scratching = true;
    canvas.setPointerCapture(e.pointerId);
    const p = pointerPos(e);
    last = p;
    look = p;
    scratchSegment(p.x, p.y, p.x, p.y);
  });
  canvas.addEventListener("pointermove", (e) => {
    const p = pointerPos(e);
    look = p;
    if (!scratching || !accepting) return;
    e.preventDefault();
    if (last) scratchSegment(last.x, last.y, p.x, p.y);
    last = p;
  });
  function endStroke() {
    scratching = false;
    last = null;
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  resetBtn.addEventListener("click", resetAll);

  function blob(x, y, rx, ry, fill, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot || 0);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.restore();
  }

  function drawBackdrop() {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    [[70, 54, 1], [300, 36, 0.8], [400, 78, 0.7]].forEach(([x, y, s]) => {
      ctx.beginPath();
      ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
      ctx.arc(x + 20 * s, y - 6 * s, 20 * s, 0, Math.PI * 2);
      ctx.arc(x + 42 * s, y, 14 * s, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = "#7dce63";
    ctx.beginPath();
    ctx.ellipse(240, 512, 280, 78, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#b6ee8e";
    ctx.beginPath();
    ctx.ellipse(240, 498, 230, 46, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGoose(yOff) {
    const y = yOff;
    ctx.strokeStyle = INK;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.fillStyle = "#fffdf7";
    ctx.beginPath();
    ctx.moveTo(150, 250 + y);
    ctx.quadraticCurveTo(90, 230 + y, 120, 200 + y);
    ctx.quadraticCurveTo(130, 240 + y, 168, 246 + y);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(146, 286 + y);
    ctx.quadraticCurveTo(78, 300 + y, 118, 328 + y);
    ctx.quadraticCurveTo(140, 300 + y, 170, 292 + y);
    ctx.fill();
    ctx.stroke();

    blob(214, 286 + y, 112, 70, "#fffdf7");
    blob(196, 292 + y, 52, 30, "#f4efe4", -0.5);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(168, 286 + y);
    ctx.quadraticCurveTo(196, 276 + y, 230, 292 + y);
    ctx.moveTo(172, 302 + y);
    ctx.quadraticCurveTo(200, 294 + y, 228, 306 + y);
    ctx.stroke();

    ctx.fillStyle = "#fffdf7";
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(268, 250 + y);
    ctx.quadraticCurveTo(330, 210 + y, 318, 150 + y);
    ctx.lineTo(300, 156 + y);
    ctx.quadraticCurveTo(300, 214 + y, 250, 262 + y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    blob(312, 132 + y, 40, 36, "#fffdf7");
    ctx.fillStyle = "#ff9a1f";
    ctx.beginPath();
    ctx.moveTo(338, 124 + y);
    ctx.lineTo(398, 136 + y);
    ctx.lineTo(338, 152 + y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(344, 138 + y);
    ctx.lineTo(388, 140 + y);
    ctx.stroke();

    ctx.fillStyle = "#ff4f81";
    function bowHalf(sign) {
      ctx.beginPath();
      ctx.moveTo(286, 176 + y);
      ctx.lineTo(286 + sign * 26, 160 + y);
      ctx.lineTo(286 + sign * 20, 192 + y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    bowHalf(-1);
    bowHalf(1);
    ctx.fillStyle = "#ffd0e2";
    ctx.beginPath();
    ctx.arc(286, 176 + y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(255, 122, 150, 0.7)";
    ctx.beginPath();
    ctx.ellipse(286, 146 + y, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    function eye(x, yy, r) {
      ctx.beginPath();
      ctx.arc(x, yy, r, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = INK;
      ctx.stroke();
      const dx = look.x - x;
      const dy = look.y - yy;
      const m = Math.hypot(dx, dy) || 1;
      const px = x + (dx / m) * r * 0.38;
      const py = yy + (dy / m) * r * 0.38;
      ctx.beginPath();
      ctx.arc(px, py, r * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = INK;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(px - r * 0.16, py - r * 0.18, r * 0.16, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
    }
    eye(298, 124 + y, 11);
    eye(326, 120 + y, 13);

    ctx.fillStyle = "#fffdf7";
    ctx.beginPath();
    ctx.ellipse(300, 100 + y, 8, 16, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  function drawFeet() {
    ctx.strokeStyle = "#ff9a1f";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    [[188, 470], [292, 474]].forEach(([x, y]) => {
      ctx.beginPath();
      ctx.moveTo(x, y - 18);
      ctx.lineTo(x, y);
      ctx.moveTo(x, y);
      ctx.lineTo(x - 16, y + 8);
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + 12);
      ctx.moveTo(x, y);
      ctx.lineTo(x + 16, y + 8);
      ctx.stroke();
    });
  }

  function drawPrize() {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(egg.cx, egg.cy, egg.rx, egg.ry, 0, 0, Math.PI * 2);
    ctx.clip();
    const g = ctx.createLinearGradient(egg.cx, egg.cy - egg.ry, egg.cx, egg.cy + egg.ry);
    g.addColorStop(0, "#ffe792");
    g.addColorStop(1, "#f0a020");
    ctx.fillStyle = g;
    ctx.fillRect(egg.cx - egg.rx, egg.cy - egg.ry, egg.rx * 2, egg.ry * 2);
    ctx.beginPath();
    ctx.arc(egg.cx, egg.cy - 4, 52, 0, Math.PI * 2);
    ctx.fillStyle = "#fff8dc";
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#e09412";
    ctx.stroke();
    ctx.fillStyle = "#a86400";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "900 48px Trebuchet MS, Segoe UI, sans-serif";
    ctx.fillText("$1", egg.cx, egg.cy - 2);
    ctx.font = "800 13px Trebuchet MS, Segoe UI, sans-serif";
    ctx.fillText("ONE GOOSE BUCK", egg.cx, egg.cy + 74);
    ctx.restore();
  }

  function drawRim() {
    ctx.beginPath();
    ctx.ellipse(egg.cx, egg.cy, egg.rx, egg.ry, 0, 0, Math.PI * 2);
    ctx.lineWidth = 5;
    ctx.strokeStyle = INK;
    ctx.stroke();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBubble() {
    roundRect(18, 16, 150, 48, 16);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(132, 60);
    ctx.lineTo(176, 92);
    ctx.lineTo(118, 62);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.font = "800 18px Trebuchet MS, Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(bubble, 93, 40);
  }

  function drawSparkles() {
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.x += s.vx;
      s.y += s.vy;
      s.life -= 0.04;
      if (s.life <= 0) {
        sparkles.splice(i, 1);
        continue;
      }
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = "#fff7c8";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.rot += p.vr;
      p.life -= 0.012;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.kind === "coin") {
        ctx.fillStyle = "#ffd34a";
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#a86400";
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.ellipse(0, 0, 8, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = INK;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.restore();
    }
    if (!floater) return;
    floater.y -= 0.8;
    floater.life -= 0.014;
    if (floater.life <= 0) {
      floater = null;
      return;
    }
    ctx.globalAlpha = Math.max(0, floater.life);
    ctx.fillStyle = "#178a45";
    ctx.font = "900 42px Trebuchet MS, Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("+$1", egg.cx, floater.y);
    ctx.globalAlpha = 1;
  }

  function frame() {
    if (hop > 0) hop = Math.max(0, hop - 0.018);
    const yOff = -Math.sin(hop * Math.PI) * 26;
    ctx.clearRect(0, 0, W, H);
    drawBackdrop();
    drawGoose(yOff);
    drawFeet();
    drawPrize();
    ctx.drawImage(foil, 0, 0, W, H);
    drawRim();
    drawBubble();
    drawSparkles();
    drawParticles();
    requestAnimationFrame(frame);
  }

  buildInside();
  paintFoil();
  renderTotal(false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
